name: Deploy Trust Center to GitHub Pages

on:
  push:
    branches: [main]
  # Run the claim gate on PRs too. Without this, a broken claim check was only
  # discovered after merge, on main, where it silently blocked every deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fixture tests of the dependency-advisory checker, so a checker that has
      # stopped being able to fail is caught before it is trusted below.
      - run: npm run test:audit

      # Audit every package in the lockfile, dev dependencies included, against
      # the exceptions in audit-waivers.json. The site declares no runtime
      # dependencies and is built entirely from dev ones, so an audit scoped
      # with --omit=dev had nothing to examine and could not fail (PB33). What
      # this step blocks, and how to record an exception, is in CONTRIBUTING.md,
      # "Dependency advisories".
      - run: npm run check:audit

      - run: npm run test:claims

      - run: npm run check:claims

      - run: npm run build

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: .vitepress/dist

  deploy:
    # PRs validate the site and the claim gate; only main publishes.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
